 {id:'funk', title:'Funk It', artist:'Tobu', bpm:100, file:'tobu-funk-it.mp3', description:'轻快律动 · 左右交替'},
 {id:'back', title:'Back To You', artist:'Tobu', bpm:101, file:'tobu-back-to-you.mp3', description:'旋律训练 · 交替与同手组合'},
 {id:'neon', title:'Neon Pulse', artist:'MotionFit', bpm:100, file:'neon-pulse-100bpm-120s.wav', description:'原创电子 · 两分钟训练'},
];

// Locate the beat phase in the supplied recording rather than assuming a beat at t=0.
function buildChart(buffer, song) {
 const step=.01, data=buffer.getChannelData(0), rate=buffer.sampleRate;
 const energies=[];let previous=0;
 for(let t=0;t<buffer.duration;t+=step){
  let energy=0,count=0;
  for(let i=Math.floor(t*rate);i<Math.min(data.length,(t+step)*rate);i+=4){energy+=data[i]*data[i];count++;}
  const rms=Math.sqrt(energy/Math.max(count,1));
  energies.push({energy:rms,onset:Math.max(0,rms-previous)});previous=rms;
 }
 const beat=60/song.bpm;
 let phase=0,best=-Infinity;
 for(let offset=0;offset<beat;offset+=step){
  let score=0;
  for(let t=offset;t<Math.min(buffer.duration,120);t+=beat){
   const i=Math.round(t/step);score+=Math.max(...energies.slice(Math.max(0,i-1),i+2).map(e=>e.onset),0);
  }
  if(score>best){best=score;phase=offset;}
 }
 const notes=[];
 const patterns=song.id==='back'?['left','right','left','right','left','left','right','right']:['left','right'];
 for(let i=0,time=phase;time<buffer.duration-2;i++,time=phase+i*beat){
  if(time<3)continue;
  const standEvery=song.standEvery??32;
  const position=i%standEvery;
  const standPosition=standEvery/2;
  // Leave two beats before and three beats after standing clear.
  if(i>=standEvery&&position>=standPosition-2&&position<=standPosition+3){
   if(position===standPosition)notes.push({time,type:'stand'});
   continue;
  }
  const index=Math.floor(time/step);
  const energy=Math.max(0,...energies.slice(Math.max(0,index-2),index+4).map(e=>e.energy));
  if(energy<.008||time<12&&i%2)continue;
  notes.push({time,type:patterns[i%patterns.length]});
 }
 return {notes,phase,beat,duration:buffer.duration};
}

// END LEVELS

import * as THREE from './vendor/three/three.module.js';

<div class="overlay" id="overlay"><div class="modal"><div class="eyebrow">YOUR BODY IS THE CONTROLLER</div><h1 id="modalTitle">MOVE. PUNCH.<br><span>LEVEL UP.</span></h1><p id="modalText">开启摄像头，用真实身体动作击中光球。坐着跟随音乐出拳；看到 ↑ 音符时完成起立动作，选择歌曲，开始完整音乐训练。</p><div class="features"><span>🥊 左 / 右挥拳</span><span>🪑 坐姿游玩</span><span>⚡ 连击加分</span><span id="songBadge">🎵 选择训练歌曲</span></div><div class="song-picker"><label for="songSelect">选择歌曲 / 关卡</label><select id="songSelect"></select><button class="secondary" id="standTestStart" hidden>↑ 站立检测测试</button><p id="songInfo"></p></div><div class="actions"><button class="primary" id="cameraStart">📷 摄像头开始</button><button class="secondary" id="demoStart">⌨ 键盘试玩</button></div><div id="loadingPanel" hidden aria-live="polite"><div id="loadingLabel"></div><progress id="loadingBar" max="100" aria-label="当前步骤加载进度"></progress><div id="loadingDetail"></div></div><p class="smallprint" id="modalNote">建议 Chrome / Edge 桌面浏览器，开始时请坐稳一秒校准，让头、肩膀和双手入镜。起立通过头肩一起上移判断，请保持摄像头固定，起立后双肩仍需入镜，头部可以出画。视频只在本机处理，不上传服务器。</p></div></div>`;

const $ = id => document.getElementById(id);
const localDebug = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
$('standTestStart').hidden = !localDebug;
function showLoading(label, percent = null, detail = '') {
    $('loadingPanel').hidden = false;
    $('loadingLabel').textContent = label;
    $('loadingDetail').textContent = detail;
    if (percent === null) $('loadingBar').removeAttribute('value');

    for (const id of ['songSelect', 'cameraStart', 'demoStart', 'standTestStart']) $(id).disabled = locked;
}
const paintLoading = () => new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
// Vite serves public/ at its base URL; Python serves the directory itself.
const resourceBase = new URL(import.meta.env?.BASE_URL ?? './public/', document.baseURI);
const resourceURL = path => new URL(path, resourceBase).href;
async function fetchWithProgress(url, label) {
    showLoading(label, null, '正在连接…');
    const response = await fetch(url);
    if (!response.ok) throw Error(`${label}失败（HTTP ${response.status}）`);
    const total = Number(response.headers.get('content-length'));
    const reader = response.body?.getReader();
    if (!reader) return new Uint8Array(await response.arrayBuffer());
    const chunks = []; let loaded = 0;
    while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value); loaded += value.byteLength;
        const known = total > 0 && !response.headers.get('content-encoding');
        const percent = known ? Math.min(100, loaded / total * 100) : null;
        showLoading(label, percent, `${(loaded / 1048576).toFixed(1)} MB${known ? ` / ${(total / 1048576).toFixed(1)} MB · ${Math.floor(percent)}%` : ' 已下载'}`);
    }
    const bytes = new Uint8Array(loaded); let offset = 0;
    for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }
    showLoading(label, 100, '下载完成');
    return bytes;
}
let cameraPreparing = false;
let standTesting = false, testCalibrating = false, testDone = false, testCount = 0;
const STAND_RULE = { shoulder: .22, head: .15, frames: 3 };
function evaluateStand(base, current, frames) {
    const rise = (base.shoulder - current.shoulder) / base.width;
    const headRise = (base.head - current.head) / base.width;
    const sameDistance = current.width / base.width > .8 && current.width / base.width < 1.25;
    const headOK = !current.headVisible || base.headVisible === false || headRise > STAND_RULE.head;
    const nextFrames = rise > STAND_RULE.shoulder && headOK && sameDistance ? frames + 1 : 0;
    return {rise, headRise, sameDistance, headOK, frames: nextFrames, complete: nextFrames >= STAND_RULE.frames};
}
function startStandTest() {
    standTesting = true; testCalibrating = false; testDone = false; testCount = 0;
    mode = 'camera'; detectClock = 0; lastVideoTime = -1; standFrames = 0; standBaseline = null;
    $('testCount').textContent = '0'; $('testRise').value = 0;
    $('testResult').textContent = '请坐稳，然后点击校准'; $('testMetrics').textContent = '肩部上移门槛：肩宽的 22%';
    $('loadingPanel').hidden = true; $('overlay').classList.add('hidden'); $('standTestPanel').hidden = false;
    document.body.classList.add('stand-testing');
}
function readStandTest(p) {
    const visible = [11, 12].every(i => p[i].visibility > .55 && p[i].x >= 0 && p[i].x <= 1 && p[i].y >= 0 && p[i].y <= 1);
    if (!visible) { standFrames = 0; if (testCalibrating) { seatSamples = 0; seatedUpper = null; } $('testResult').textContent = '请让双肩保持入镜'; return; }
    const headVisible = p[0].visibility > .55 && p[0].y >= 0 && p[0].y <= 1;
    const current = { shoulder: (p[11].y + p[12].y) / 2, head: p[0].y, headVisible, width: Math.max(dist(p[11], p[12]), .08) };
    if (testCalibrating) {
        seatedUpper ??= {shoulder: 0, head: 0, width: 0, headVisible: true};
        for (const key of ['shoulder', 'head', 'width']) seatedUpper[key] = (seatedUpper[key] * seatSamples + current[key]) / (seatSamples + 1);
        seatedUpper.headVisible &&= headVisible;
        seatSamples++;
        $('testResult').textContent = `保持坐稳 · 校准 ${seatSamples}/15`;
        if (seatSamples >= 15) { testCalibrating = false; standBaseline = {...seatedUpper}; $('testResult').textContent = '✓ 校准完成，现在站起来'; }
        return;
    }
    if (!standBaseline) return;
    const result = evaluateStand(standBaseline, current, standFrames);
    standFrames = result.frames;
    $('testRise').value = Math.max(0, Math.min(100, result.rise / STAND_RULE.shoulder * 100));
    $('testMetrics').textContent = `肩部上移 ${(result.rise * 100).toFixed(1)}% / 22% · 头部 ${headVisible ? (result.headRise * 100).toFixed(1) + '% / 15%' : '出画，跳过'} · 连续 ${Math.min(standFrames, 3)}/3 次`;
    if (testDone) { $('testResult').textContent = '✓ 动作完成！坐稳后点击“下一次测试”'; return; }
    if (result.complete) { testDone = true; $('testCount').textContent = ++testCount; $('testResult').textContent = '✓ 动作完成！坐稳后点击“下一次测试”'; }
    else $('testResult').textContent = !result.sameDistance ? '距离变化过大，请避免前倾' : result.rise <= STAND_RULE.shoulder ? '等待向上动作 · 幅度尚未达到门槛' : !result.headOK ? '肩部已达标，等待头部一起上移' : '幅度达标，正在确认动作…';
}

$('songSelect').onchange = updateSong; updateSong();

        if (result.landmarks.length) { const points = result.landmarks[0]; mirror.style.opacity = '.7'; mirrorDraw.drawConnectors(points, PoseLandmarker.POSE_CONNECTIONS, { color: '#28f4df', lineWidth: 5 }); mirrorDraw.drawLandmarks(points, { color: '#ffffff', radius: 4 }); draw.drawConnectors(points, PoseLandmarker.POSE_CONNECTIONS, { color: '#28f4df', lineWidth: 3 }); draw.drawLandmarks(points, { color: '#f9fbff', radius: 2.3 }); readPose(points, now); setStatus('已检测到人体 · 跟随节拍左右出拳', true); }
        else { if (standTesting) { if (testCalibrating) { seatSamples = 0; seatedUpper = null; } $('testResult').textContent = '未检测到身体，请回到镜头内'; } prevTime = 0; standFrames = 0; $('postureCue').textContent = '未检测到身体 · 请回到镜头内'; setStatus('请让头、肩膀和双手回到镜头内'); armState.left = false; armState.right = false; prevWrist.left = null; prevWrist.right = null; }
    } catch (e) { console.warn('Pose detection error', e); setStatus('姿态识别暂时失败'); }
}
function finish() {
    paused = false; $('pauseButton').hidden = true; $('pauseOverlay').hidden = true;
    $('standCue').textContent = '';
    stopMusic(); lockStart(false);
    playing = false; $('overlay').classList.remove('hidden'); $('modalTitle').innerHTML = 'WORKOUT <span>DONE!</span>';
    $('modalText').textContent = `《${activeSong.title}》完成 · 得分 ${score.toLocaleString()} · 漏掉 ${misses} 个目标。再挑战一次，刷新你的纪录！`;
    $('cameraStart').textContent = '📷 摄像头再来一次'; $('demoStart').textContent = '⌨ 键盘再来一次'; $('modalNote').textContent = '准备好后继续游戏。此版本不会储存摄像头画面。';
}
function animate(now) {
    requestAnimationFrame(animate); const dt = Math.min((now - lastFrame) / 1000, .05); lastFrame = now;
    portalGroup.children.forEach((p, i) => { p.rotation.z = Math.PI / 2 + Math.sin(now * .0005 + i) * .04; });
    if (standTesting) processCamera(now);
    if (playing && !paused) {
        const elapsed = Math.max(0, audio.currentTime - musicEpoch); const remain = Math.max(0, DURATION - elapsed); $('time').textContent = Math.ceil(remain); $('progress').style.width = (elapsed / DURATION * 100) + '%';
        processCamera(now);
        // Spawn early enough for targets to travel from SPAWN_Z to HIT_Z.
        const travel = (HIT_Z - SPAWN_Z) / SPEED;
        while (noteIndex < chart.notes.length && chart.notes[noteIndex].time <= elapsed) {
            const note = chart.notes[noteIndex++]; spawnTarget(note.type); targets[targets.length - 1].hitAt = note.time + travel;
        }
        for (const t of targets) {
            if (t.hit) continue; t.mesh.position.z = HIT_Z + (elapsed - t.hitAt) * SPEED;
            const gap = Math.abs(t.mesh.position.z - HIT_Z);
            const tint = t.passed ? 0x526078 : gap < hitWindow(t.type) ? 0x4dff81 : gap < 7 ? 0xffd34d : styles[t.type].color;
            t.mesh.children[0].material.color.setHex(tint); t.mesh.children[0].material.emissive.setHex(tint);
            t.mesh.children[0].material.emissiveIntensity = gap < hitWindow(t.type) ? 2.6 : 1.3;
            t.mesh.children[1].material.color.setHex(tint); t.mesh.rotation.z += dt * .7; t.mesh.children[1].scale.setScalar(1 + Math.sin(now * .009) * .1);
            if (t.mesh.position.z > HIT_Z + hitWindow(t.type) && !t.passed) { t.passed = true; combo = 0; misses++; updateStats(); flash('MISS', false); }
        }
        for (const t of targets.filter(x => x.passed && x.mesh.position.z > 18)) { scene.remove(t.mesh); t.mesh.traverse(o => { o.geometry?.dispose(); if (o.material) { o.material.map?.dispose(); o.material.dispose(); } }); }
        targets = targets.filter(x => !x.hit && !(x.passed && x.mesh.position.z > 18));
        updateTiming();
        if (remain <= 0) finish();
    }
    for (const p of particles) { if (paused) continue; p.life -= dt; p.mesh.position.addScaledVector(p.mesh.userData.velocity, dt); p.mesh.scale.setScalar(Math.max(0, p.life / .45)); }
    for (const p of particles.filter(x => x.life <= 0)) { scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); }

    renderer.render(scene, camera);
}
requestAnimationFrame(animate);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
addEventListener('beforeunload', () => { cameraStream?.getTracks().forEach(t => t.stop()); pose?.close(); });
